name: Contribution garden

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-garden
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 공식 릴리스 태그에서 확인한 커밋으로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test the garden contract
        run: node --test tests/*.test.mjs
      - name: Fetch and grow the garden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contribution-garden.mjs --update-readme
      - name: Commit the validated garden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contribution-calendar.json data/garden-summary.md assets/contribution-garden.svg assets/contribution-garden-mobile.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: 실제 기여 달력으로 정원 갱신"
            git push
          fi
