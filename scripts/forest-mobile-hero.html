<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Supia mobile woodland entrance</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 400px; height: 440px; overflow: hidden; }
    body { background: #071c17; color: #e9efe0; font-family: Georgia, serif; }
    img { position: absolute; width: 400px; height: 440px; object-fit: cover; object-position: 85%; }
    .shade { position: absolute; inset: 0; background: linear-gradient(#071c17cc,transparent 48%,#071c17d9); }

    .label { font: 12px monospace; letter-spacing: 2px; color: #b4dcd0; }
    h1 { font-size: 64px; font-weight: 400; margin: 16px 0; letter-spacing: -2px; }
    .signature { position: absolute; bottom: 32px; left: 24px; font-size: 24px; }
  </style>
</head>
<body>
  <img src="../assets/supia-forest-scene.webp" alt="">
  <div class="shade"></div>
  <div class="copy"><div class="label">A QUIET CORNER OF THE FOREST</div><h1>Supia.</h1></div>
  <div class="signature">Small stone. Useful systems.</div>
</body>
</html>
